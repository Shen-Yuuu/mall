<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div id = "app">
        <table align="center" width="100%" border="1">
            <tr>
                <th>id</th>
                <th>名字</th>
                <th>价格</th>
                <th>图片</th>
                <th>描述</th>
            </tr>
            <tr v-for="item in items">
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.price }}</td>
                <td><img :src="item.image" width="100px" height="100px"></td>
                <td>{{ item.description }}</td>

                <td>
                    <a :href="'updateItem.html?id=' + item.id">修改</a>
                    <a href="#" @click.prevent="deleteItem(item.id)">删除</a>
                </td>

            </tr>
        </table>
    </div>

    <script src="js/vue.js"></script>
    <script src="js/axios.min.js"></script>
    <script>
        let config = {
            el: '#app',
            data: {
                items: []
            },
            methods: {
                getItems: function () {
                    let url = window.location.href;
                    let categoryId = url.split('=')[1];
                    axios.get('item/selectByCategoryId?categoryId=' + categoryId).then(response => {
                        console.log(response);
                        this.items = response.data.data;
                    })
                },
                deleteItem: function (id) {
                    if(confirm('确定要删除吗？')){
                        axios.delete('item/deleteById?id=' + id).then(response => {
                            console.log(response);
                            this.getItems();
                        })
                    }

                }

            }
        };

        let vue = new Vue(config)
        vue.getItems()
    </script>
</body>
</html>
