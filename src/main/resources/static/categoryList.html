<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div id = "app">
        <table align="center" width="200px" border="1">
            <tr>
                <th>编号</th>
                <th>名称</th>
                <th>查看商品</th>
            </tr>
            <tr v-for="category in categories">
                <td>{{ category.id }}</td>
                <td>{{ category.name }}</td>
                <td>
                    <a :href="'itemList.html?categoryId=' + category.id">查看商品</a>
                </td>
            </tr>
        </table>
    </div>

    <script src="js/vue.js"></script>
    <script src = "js/axios.min.js"></script>
    <script>
        let config = {
            el:'#app',
            data:{
                categories: []
            },
            methods: {
                getCategories: function(){
                    axios.get('http://localhost:8091/category/selectAll').then(response => {

                        console.log(response);
                        this.categories = response.data.data;

                    }).catch(function(error) {

                        console.error('Error fetching categories:', error);

                    });
                }
            },

        };

       let vue = new Vue(config);
        vue.getCategories()
    </script>
</body>
</html>
