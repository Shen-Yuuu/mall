<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id = "app">
    <table align="center" width="200px" border="1">
        <tr>
            <th>id</th>
            <th>用户名</th>
            <th>密码</th>
        </tr>
        <tr v-for="user in users">
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.password }}</td>
            <td>
                <a :href="'orderList.html?userId='+user.id">查看订单</a>
            </td>
        </tr>
    </table>
</div>

<script src="js/vue.js"></script>
<script src = "js/axios.min.js"></script>
<script>
    let config = {
        el:'#app',
        data:{
            users: []
        },
        methods: {
            getusers: function(){
                axios.get('http://localhost:8091/user/selectAll').then(response => {

                    console.log(response);
                    console.log("hello");
                    this.users = response.data.data;

                }).catch(function(error) {

                    console.error('Error fetching users:', error);

                });
            }
        },

    };

    let vue = new Vue(config);
    vue.getusers()
</script>
</body>
</html>
